name: Build Newest Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 / amd64
          - platform: linux-x86_64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            bundle-suffix: amd64
          
          # Linux ARM64 / aarch64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            bundle-suffix: arm64
          
          # Windows x86_64
          - platform: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle-suffix: x64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: TypeScript type check
        run: npm run typecheck
      
      - name: Cargo workspace check
        run: cargo check --workspace
      
      - name: Build Tauri release
        run: npm run desktop:build
      
      # Linux artifacts
      - name: Verify Linux .deb artifact
        if: runner.os == 'Linux'
        run: |
          DEB_FILE=$(find target/release/bundle/deb -name "*.deb" -type f | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "Error: .deb file not found"
            exit 1
          fi
          echo "Found .deb: $DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
      
      - name: Verify Linux AppImage artifact
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_FILE=$(find target/release/bundle/appimage -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "Error: AppImage file not found"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE_FILE"
          file "$APPIMAGE_FILE"
          test -x "$APPIMAGE_FILE" || (echo "Error: AppImage is not executable" && exit 1)
      
      - name: Upload Linux .deb artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Newest-Launcher-${{ matrix.platform }}-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      
      - name: Upload Linux AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Newest-Launcher-${{ matrix.platform }}-AppImage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      
      # Windows artifacts
      - name: Verify Windows bundle artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "target\release\bundle\nsis" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          $msiFiles = Get-ChildItem -Path "target\release\bundle\msi" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          
          if ($exeFiles.Count -eq 0 -and $msiFiles.Count -eq 0) {
            Write-Error "Error: No .exe or .msi files found in bundle"
            exit 1
          }
          
          if ($exeFiles.Count -gt 0) {
            Write-Host "Found .exe files:"
            $exeFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
          }
          
          if ($msiFiles.Count -gt 0) {
            Write-Host "Found .msi files:"
            $msiFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
          }
      
      - name: Upload Windows .exe artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Newest-Launcher-${{ matrix.platform }}-exe
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      
      - name: Upload Windows .msi artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Newest-Launcher-${{ matrix.platform }}-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: ignore
